#   conda env create -f environment.yml
#   conda activate isce3
name: isce3

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11
  # Matches the working isce3 env; isce3 itself allows numpy <3.
  - numpy<2
  - scipy>=1.11
  - h5py>=3.10
  # No GUI backend needed; plots are only written to file.
  - matplotlib-base>=3.8
  - pandas>=2.2
  # Also provides the nisar package (geocode.py).
  - isce3>=0.25
  - gdal>=3.12
  - ipython
  - pytest>=8
